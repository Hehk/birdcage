[package]
name = "birdcage"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
build = "platform/build.rs"

[[bin]]
name = "birdcage"
path = "platform/host.rs"

[dependencies]
tokio = { version = "1", features = ["rt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
