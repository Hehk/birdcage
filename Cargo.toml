[package]
name = "birdcage"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
publish = false
build = "platform/build.rs"

[[bin]]
name = "birdcage"
path = "platform/host.rs"

[dependencies]
# ureq keeps hosted HTTP synchronous without nesting Tokio runtimes; revisit for async I/O or streaming.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
